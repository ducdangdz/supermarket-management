name: supermarket_hrm
description: "Supermarket HRM - Employee App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & Routing
  provider: ^6.1.2
  go_router: ^14.6.3

  # Network
  dio: ^5.7.0
  http: ^1.2.2

  # Auth & Storage
  google_sign_in: ^6.2.0
  shared_preferences: ^2.3.3

  # UI
  table_calendar: ^3.1.3
  intl: ^0.20.2
  mobile_scanner: ^7.4.2
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
