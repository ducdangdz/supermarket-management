server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: smartmarket-hrm-api
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:smartmarket_hrm};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
  storage:
    # Thư mục lưu ảnh bằng chứng chấm công (tương đối với thư mục chạy backend)
    evidence-dir: ${EVIDENCE_DIR:uploads/evidence}
