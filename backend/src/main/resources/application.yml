server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: smartmarket-hrm-api
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:smartmarket_hrm};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  auth:
    mail-from: ${MAIL_FROM:}
    google-client-id: ${GOOGLE_CLIENT_ID:1066032644057-3d0l0gkbpj6h8b9ffm2gaf04h5n21816.apps.googleusercontent.com}

